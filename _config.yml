title: "Rod Grac — Portfolio"
email: your-email@example.com
description: >-
  ML Engineer • Systems Builder • Musician  
  Portfolio · Projects · Music · Notes

# Build settings
markdown: kramdown
remote_theme: "mmistakes/minimal-mistakes@4.24.0"

url: "https://rodgrac.github.io"
baseurl: ""

plugins:
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Theme Settings
minimal_mistakes_skin: "dark"

search: true

# Author Profile (shows in sidebar)
author:
  name: "Rod Grac"
  avatar: "/assets/images/profile.jpg"
  bio: "ML Engineer · Systems Designer · Musician"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/your-username"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/in/your-linkedin"
    - label: "YouTube"
      icon: "fab fa-youtube"
      url: "https://youtube.com/your-channel"
    - label: "Spotify"
      icon: "fab fa-spotify"
      url: "https://open.spotify.com/artist/your-profile"

# Navigation menu (loaded from _data/navigation.yml)
collections:
  pages:
    output: true
    permalink: /:title/

paginate: 6

feature_row:
  projects: _data/projects.yml
